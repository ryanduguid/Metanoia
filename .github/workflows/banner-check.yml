name: banner-check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  banner:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python -m unittest discover -s tools -p "test_*.py" -v
      - name: Gate every rendered block against the README that carries it
        env:
          # Read-only. Lifts the unauthenticated GitHub API rate limit for the
          # README reads in tools/banner.py.
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/banner.py --check
